name: Build PidorasCoin APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/pidorascoin/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PidorasCoin"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pidorascoin.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.pidorascoin.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.VIBRATE"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="Pidoras Coin">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101114</item>
                  <item name="android:navigationBarColor">#101114</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/pidorascoin/app/MainActivity.java <<'EOF'
          package com.pidorascoin.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.view.animation.AccelerateDecelerateInterpolator;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.security.SecureRandom;

          public class MainActivity extends Activity {

              private TextView coin;
              private TextView result;
              private boolean flipping = false;
              private final SecureRandom random = new SecureRandom();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(40, 40, 40, 40);
                  root.setBackgroundColor(Color.rgb(16,17,20));

                  TextView title = new TextView(this);
                  title.setText("PIDORAS COIN");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(30);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0,0,0,70);

                  coin = new TextView(this);
                  coin.setText("?");
                  coin.setTextSize(38);
                  coin.setTextColor(Color.rgb(40,30,5));
                  coin.setGravity(Gravity.CENTER);

                  GradientDrawable circle = new GradientDrawable();
                  circle.setShape(GradientDrawable.OVAL);
                  circle.setColor(Color.rgb(225,180,55));
                  circle.setStroke(10, Color.rgb(255,220,100));
                  coin.setBackground(circle);

                  LinearLayout.LayoutParams coinParams =
                      new LinearLayout.LayoutParams(420,420);

                  coin.setLayoutParams(coinParams);

                  result = new TextView(this);
                  result.setText("TAP THE COIN");
                  result.setTextColor(Color.WHITE);
                  result.setTextSize(25);
                  result.setGravity(Gravity.CENTER);
                  result.setPadding(0,70,0,0);

                  root.addView(title);
                  root.addView(coin);
                  root.addView(result);

                  setContentView(root);

                  coin.setOnClickListener(v -> flip());
              }

              private void flip() {
                  if (flipping) return;
                  flipping = true;

                  boolean pidoras = random.nextBoolean();

                  result.setText("...");
                  coin.setText("");

                  coin.animate()
                      .rotationYBy(1800f + (pidoras ? 0f : 180f))
                      .rotationXBy(360f)
                      .scaleX(0.75f)
                      .scaleY(0.75f)
                      .setDuration(1300)
                      .setInterpolator(new AccelerateDecelerateInterpolator())
                      .withEndAction(() -> {

                          coin.setRotationX(0);
                          coin.setRotationY(0);
                          coin.setScaleX(1);
                          coin.setScaleY(1);

                          if (pidoras) {
                              coin.setText("PIDORAS");
                              result.setText("PIDORAS");
                          } else {
                              coin.setText("INTE\nPIDORAS");
                              result.setText("INTE PIDORAS");
                          }

                          Vibrator vibrator =
                              (Vibrator)getSystemService(VIBRATOR_SERVICE);

                          if (vibrator != null) {
                              vibrator.vibrate(
                                  VibrationEffect.createOneShot(
                                      70,
                                      VibrationEffect.DEFAULT_AMPLITUDE
                                  )
                              );
                          }

                          flipping = false;
                      })
                      .start();
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PidorasCoin.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PidorasCoin-APK
          path: PidorasCoin.apk
