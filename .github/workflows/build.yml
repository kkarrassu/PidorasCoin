# One file is enough. Put this file in .github/workflows/build.yml.
# Pidoras Coin 2.0 / offline / Android 8+ / 50-50
name: PidorasCoin 2.0 - Swedish APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pidorascoin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Create complete Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .
          cat > settings.gradle <<'COIN_SOURCE_000_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'PidorasCoin'
          include ':app'
          COIN_SOURCE_000_EOF
          mkdir -p .
          cat > build.gradle <<'COIN_SOURCE_001_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          COIN_SOURCE_001_EOF
          mkdir -p .
          cat > gradle.properties <<'COIN_SOURCE_002_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=false
          COIN_SOURCE_002_EOF
          mkdir -p app
          cat > app/build.gradle <<'COIN_SOURCE_003_EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.pidorascoin.app'
              compileSdk 35
              buildToolsVersion '34.0.0'

              defaultConfig {
                  applicationId 'com.pidorascoin.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 20000 + (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError true
                  checkReleaseBuilds true
                  disable 'SetJavaScriptEnabled'
              }
          }
          COIN_SOURCE_003_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'COIN_SOURCE_004_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Pidoras Coin"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          COIN_SOURCE_004_EOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/app.js <<'COIN_SOURCE_005_EOF'
          (function () {
            'use strict';
            const $ = id => document.getElementById(id);
            const native = window.CoinNative;
            const storageKey = 'pidoras-coin-v2';
            let savingFailed = false;
            const storage = {
              load() { return native ? native.load() : localStorage.getItem(storageKey); },
              save(value) {
                try {
                  const saved = native ? native.save(value) : (localStorage.setItem(storageKey, value), true);
                  if (!saved) savingFailed = true;
                  return saved;
                } catch (_) { savingFailed = true; return false; }
              }
            };
            function secureChoice() {
              if (native) return native.choose();
              // Exact bit split. No modulo bias and no Math.random fallback.
              const bytes = new Uint8Array(1);
              window.crypto.getRandomValues(bytes);
              return (bytes[0] & 1) === 0 ? 'p' : 'i';
            }
            const engine = new CoinEngine(storage, secureChoice);
            const coin = $('coin-spin');
            const lift = $('coin-lift');
            const shadow = $('shadow');
            const scene = $('scene');
            const toss = $('toss');
            const coinButton = $('coin-button');
            const overlay = $('history-overlay');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            let busy = false;
            let animations = [];
            let finishTimer = 0;
            let toastTimer = 0;
            let previousFocus = null;
            let restingSide = engine.state.last || 'p';

            for (let z = -6; z <= 6; z++) {
              const layer = document.createElement('span');
              layer.className = 'edge-layer';
              layer.style.transform = 'translateZ(' + z + 'px)';
              coin.querySelector('.coin-edge').appendChild(layer);
            }

            function message(text) {
              clearTimeout(toastTimer);
              $('toast').textContent = text;
              $('toast').classList.add('visible');
              toastTimer = setTimeout(() => $('toast').classList.remove('visible'), 2200);
            }

            function haptic() {
              if (!engine.state.haptics || !native || document.hidden) return;
              try { native.haptic(); } catch (_) { /* Feedback never blocks a toss. */ }
            }

            function fullName(side) { return side === 'p' ? 'PIDORAS' : 'INTE PIDORAS'; }
            function angle(side) { return side === 'i' ? 162 : -18; }
            function pose(y, x, z) { return 'rotateX(' + x + 'deg) rotateY(' + y + 'deg) rotateZ(' + z + 'deg)'; }

            function rest(side) {
              restingSide = side || 'p';
              coin.style.transform = pose(angle(restingSide), -13, -9);
              lift.style.transform = 'translateY(0) scale(1)';
              shadow.style.transform = 'translateX(-50%) scale(1)';
              shadow.style.opacity = '.85';
              scene.classList.toggle('is-silver', restingSide === 'i');
            }

            function renderRecent() {
              const state = engine.state;
              const total = state.p + state.i;
              $('total-count').textContent = String(total).padStart(3, '0');
              const target = $('recent-items');
              target.textContent = '';
              for (let n = 0; n < 7; n++) {
                const item = state.recent[n];
                const chip = document.createElement('span');
                chip.className = 'history-chip';
                if (item) {
                  chip.textContent = item.side === 'p' ? 'P' : 'IP';
                  chip.classList.toggle('silver', item.side === 'i');
                  chip.classList.toggle('newest', n === 0);
                  chip.setAttribute('aria-label', 'Kast ' + item.number + ': ' + fullName(item.side));
                  chip.title = fullName(item.side);
                } else {
                  chip.textContent = '·';
                  chip.classList.add('empty');
                  chip.setAttribute('aria-hidden', 'true');
                }
                target.appendChild(chip);
              }
            }

            function renderResult() {
              const last = engine.state.last;
              $('result-kicker').textContent = last ? 'RESULTAT' : 'REDO FÖR ETT KAST';
              $('result-name').textContent = last ? fullName(last) : 'Din tur.';
              $('result-name').className = 'result-name' + (last ? (last === 'p' ? ' gold' : ' silver') : '');
              $('result-note').textContent = last ? 'Myntet har sagt sitt.' : 'Tryck på myntet eller knappen';
              coinButton.setAttribute('aria-label', (last ? fullName(last) + '. ' : '') + 'Singla slant');
            }

            function render() {
              renderResult();
              renderRecent();
              $('haptics').setAttribute('aria-pressed', String(engine.state.haptics));
            }

            function stopAnimations() {
              const pending = animations;
              animations = [];
              pending.forEach(animation => {
                animation.onfinish = null;
                animation.cancel();
              });
              clearTimeout(finishTimer);
            }

            function settle(feedback) {
              if (!busy) return;
              busy = false;
              const side = engine.finish() || engine.state.last || restingSide;
              stopAnimations();
              rest(side);
              toss.disabled = false;
              coinButton.disabled = false;
              $('toss-label').textContent = 'EN GÅNG TILL';
              render();
              if (!overlay.hidden) renderHistory();
              if (feedback && !reduceMotion.matches && $('landing-ring').animate) {
                $('landing-ring').animate([
                  {transform:'scale(.92)',opacity:.45},
                  {transform:'scale(1.25)',opacity:0}
                ], {duration:480,easing:'ease-out'});
                $('result-name').animate([
                  {transform:'translateY(6px)',opacity:0},
                  {transform:'translateY(0)',opacity:1}
                ], {duration:230,easing:'ease-out'});
              }
              if (feedback) haptic();
              if (savingFailed) {
                savingFailed = false;
                message('Historiken kunde inte sparas. Kastet är klart.');
              }
            }

            function flip() {
              if (busy || !overlay.hidden) return;
              let side;
              try { side = engine.begin(); }
              catch (_) { message('Det gick inte att slumpa fram ett resultat. Försök igen.'); return; }
              if (!side) return;
              busy = true;
              toss.disabled = true;
              coinButton.disabled = true;
              $('toss-label').textContent = 'I LUFTEN';
              $('result-kicker').textContent = 'MYNTET ÄR I LUFTEN';
              $('result-name').className = 'result-name';
              $('result-name').textContent = '…';
              $('result-note').textContent = 'Snart är det avgjort.';
              haptic();

              if (reduceMotion.matches || !coin.animate) {
                finishTimer = setTimeout(() => settle(true), 220);
                return;
              }

              const duration = 1650;
              const start = angle(restingSide);
              const end = angle(side) + 1800;
              try {
                const spinning = coin.animate([
                  {transform:pose(start,-13,-9)},
                  {transform:pose(end, -13,-9)}
                ], {duration,easing:'cubic-bezier(.14,.61,.18,1)',fill:'forwards'});
                animations.push(spinning);
                animations.push(lift.animate([
                  {transform:'translateY(0) scale(1)',offset:0},
                  {transform:'translateY(-36px) scale(.84)',offset:.3},
                  {transform:'translateY(5px) scale(1.02)',offset:.82},
                  {transform:'translateY(-3px) scale(.995)',offset:.92},
                  {transform:'translateY(0) scale(1)',offset:1}
                ], {duration,easing:'ease-in-out',fill:'forwards'}));
                animations.push(shadow.animate([
                  {transform:'translateX(-50%) scale(1)',opacity:.85,offset:0},
                  {transform:'translateX(-50%) scale(.6)',opacity:.35,offset:.3},
                  {transform:'translateX(-50%) scale(1.1)',opacity:.9,offset:.82},
                  {transform:'translateX(-50%) scale(1)',opacity:.85,offset:1}
                ], {duration,easing:'ease-in-out',fill:'forwards'}));
                spinning.onfinish = () => settle(true);
                spinning.oncancel = () => { if (busy) settle(false); };
                finishTimer = setTimeout(() => settle(true), duration + 200);
              } catch (_) {
                // An animation failure still delivers and saves the already selected result.
                settle(false);
              }
            }

            function renderHistory() {
              const state = engine.state;
              const total = state.p + state.i;
              $('count-p').textContent = state.p.toLocaleString('sv-SE');
              $('count-i').textContent = state.i.toLocaleString('sv-SE');
              $('percent-p').textContent = total ? (100 * state.p / total).toLocaleString('sv-SE', {minimumFractionDigits:1,maximumFractionDigits:1}) + ' % av kasten' : 'Inga kast än';
              $('percent-i').textContent = total ? (100 * state.i / total).toLocaleString('sv-SE', {minimumFractionDigits:1,maximumFractionDigits:1}) + ' % av kasten' : 'Inga kast än';
              $('clear-history').disabled = busy || !total;
              const list = $('history-list');
              list.textContent = '';
              if (!state.recent.length) {
                const empty = document.createElement('p');
                empty.className = 'history-empty';
                empty.textContent = 'Allt börjar med det första kastet.';
                list.appendChild(empty);
                return;
              }
              state.recent.forEach(item => {
                const row = document.createElement('div');
                row.className = 'history-row';
                const number = document.createElement('span');
                number.className = 'history-number';
                number.textContent = '#' + item.number;
                const name = document.createElement('span');
                name.className = 'history-side' + (item.side === 'i' ? ' silver' : '');
                name.textContent = fullName(item.side);
                const time = document.createElement('span');
                time.className = 'history-time';
                time.textContent = new Date(item.at).toLocaleString('sv-SE', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
                row.appendChild(number);
                row.appendChild(name);
                row.appendChild(time);
                list.appendChild(row);
              });
            }

            function openHistory() {
              if (!overlay.hidden) return;
              previousFocus = document.activeElement;
              renderHistory();
              $('clear-confirm').hidden = true;
              $('clear-history').hidden = false;
              overlay.hidden = false;
              document.body.classList.add('modal-open');
              $('app').setAttribute('aria-hidden', 'true');
              $('app').inert = true;
              $('close-history').focus();
              if (!reduceMotion.matches && $('history-sheet').animate) {
                $('history-sheet').animate([{transform:'translateY(45px)',opacity:.6},{transform:'translateY(0)',opacity:1}], {duration:220,easing:'ease-out'});
              }
            }

            function closeHistory() {
              if (overlay.hidden) return false;
              overlay.hidden = true;
              document.body.classList.remove('modal-open');
              $('app').removeAttribute('aria-hidden');
              $('app').inert = false;
              if (previousFocus && previousFocus.focus) previousFocus.focus();
              return true;
            }

            toss.addEventListener('click', flip);
            coinButton.addEventListener('click', flip);
            $('haptics').addEventListener('click', () => {
              engine.setHaptics(!engine.state.haptics);
              $('haptics').setAttribute('aria-pressed', String(engine.state.haptics));
              haptic();
              message(engine.state.haptics ? 'Vibration på' : 'Vibration av');
            });
            $('open-history').addEventListener('click', openHistory);
            $('close-history').addEventListener('click', closeHistory);
            overlay.addEventListener('click', event => { if (event.target === overlay) closeHistory(); });
            $('clear-history').addEventListener('click', () => {
              $('clear-confirm').hidden = false;
              $('clear-history').hidden = true;
              $('cancel-clear').focus();
            });
            $('cancel-clear').addEventListener('click', () => {
              $('clear-confirm').hidden = true;
              $('clear-history').hidden = false;
              $('clear-history').focus();
            });
            $('confirm-clear').addEventListener('click', () => {
              if (!engine.clear()) return;
              $('clear-confirm').hidden = true;
              $('clear-history').hidden = false;
              $('toss-label').textContent = 'SINGLA SLANT';
              rest('p');
              render();
              renderHistory();
              $('close-history').focus();
              message('Historiken är rensad');
            });
            document.addEventListener('keydown', event => {
              if (event.key === 'Escape' && !overlay.hidden) { event.preventDefault(); closeHistory(); }
              if (event.key === 'Tab' && !overlay.hidden) {
                const candidates = Array.from($('history-sheet').querySelectorAll('button:not(:disabled)'))
                  .filter(button => button.getClientRects().length);
                const first = candidates[0], last = candidates[candidates.length - 1];
                if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
                else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
              }
            });
            document.addEventListener('visibilitychange', () => { if (document.hidden) settle(false); });
            window.addEventListener('pagehide', () => settle(false));
            window.coinApp = {pause: () => settle(false), back: closeHistory};
            rest(restingSide);
            render();
            if (engine.state.last) $('toss-label').textContent = 'EN GÅNG TILL';
          })();
          COIN_SOURCE_005_EOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/back.svg <<'COIN_SOURCE_006_EOF'
          <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
            <defs>
              <linearGradient id="smetal" x1="10%" y1="8%" x2="90%" y2="96%">
                <stop offset="0" stop-color="#dfe7ec"/><stop offset=".17" stop-color="#78858d"/><stop offset=".38" stop-color="#f3f5f6"/><stop offset=".58" stop-color="#a2b1bb"/><stop offset=".8" stop-color="#4c5864"/><stop offset="1" stop-color="#d2dce3"/>
              </linearGradient>
              <linearGradient id="sface" x1="12%" y1="0" x2="82%" y2="100%">
                <stop stop-color="#f3f5f6"/><stop offset=".43" stop-color="#a2b1bb"/><stop offset=".68" stop-color="#d2dce3"/><stop offset="1" stop-color="#78858d"/>
              </linearGradient>
              <radialGradient id="slight" cx="30%" cy="18%" r="84%"><stop stop-color="#ffffff" stop-opacity=".27"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".18"/></radialGradient>
              <pattern id="sgrain" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M0,1 H3" stroke="#34414b" stroke-opacity=".055" stroke-width=".45"/></pattern>
              <path id="sarc" d="M41,129 A87,87 0 0,1 215,129"/>
            </defs>
            <circle cx="128" cy="128" r="127.3" fill="url(#smetal)" stroke="#4c5864" stroke-width="1.2"/>
            <circle cx="128" cy="128" r="124.5" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.1"/>
