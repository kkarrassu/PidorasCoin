          (function (scope) {
            'use strict';
            const valid = side => side === 'p' || side === 'i';
            const integer = n => Number.isSafeInteger(n) && n >= 0;
            const blank = () => ({version: 2, p: 0, i: 0, recent: [], last: null, pending: null, haptics: true});

            class CoinEngine {
              constructor(storage, choose, now) {
                this.storage = storage;
                this.choose = choose;
                this.now = now || Date.now;
                this.state = blank();
                try {
                  const raw = storage.load();
                  const s = raw ? JSON.parse(raw) : null;
                  if (s && s.version === 2 && integer(s.p) && integer(s.i) && integer(s.p + s.i)) {
                    this.state.p = s.p;
                    this.state.i = s.i;
                    this.state.haptics = s.haptics !== false;
                    this.state.last = valid(s.last) ? s.last : null;
                    this.state.recent = Array.isArray(s.recent) ? s.recent.filter(r =>
                      r && valid(r.side) && integer(r.at) && integer(r.number)
                    ).slice(0, 50) : [];
                    this.state.pending = s.pending && valid(s.pending.side) && integer(s.pending.at)
                      ? {side: s.pending.side, at: s.pending.at} : null;
                  }
                } catch (_) { /* A damaged save starts with a clean local history. */ }
                if (this.state.pending) this.finish();
              }

              persist() {
                try { return this.storage.save(JSON.stringify(this.state)) !== false; }
                catch (_) { return false; }
              }

              begin() {
                if (this.state.pending) return null;
                const side = this.choose();
                if (!valid(side)) throw new Error('Secure random source unavailable');
                this.state.pending = {side, at: this.now()};
                this.persist();
                return side;
              }

              finish() {
                const item = this.state.pending;
                if (!item) return null;
                this.state[item.side]++;
                this.state.last = item.side;
                this.state.recent.unshift({side: item.side, at: item.at, number: this.state.p + this.state.i});
                this.state.recent = this.state.recent.slice(0, 50);
                this.state.pending = null;
                this.persist();
                return item.side;
              }

              setHaptics(enabled) {
                this.state.haptics = !!enabled;
                this.persist();
              }

              clear() {
                if (this.state.pending) return false;
                const haptics = this.state.haptics;
                this.state = blank();
                this.state.haptics = haptics;
                this.persist();
                return true;
              }
            }
            if (typeof module !== 'undefined' && module.exports) module.exports = CoinEngine;
            else scope.CoinEngine = CoinEngine;
          })(typeof window === 'undefined' ? globalThis : window);
