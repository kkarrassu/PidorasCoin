      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore the app signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pidorascoin-debug-signing-v2-${{ runner.os }}-${{ github.repository_id }}

      - name: Setup Android SDK and packages
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Check JavaScript and toss recovery
        shell: bash
        run: |
          node --check app/src/main/assets/engine.js
          node --check app/src/main/assets/app.js
          node --test tests/engine.test.cjs

      - name: Check interface and save previews
        shell: bash
        run: |
          npm install --no-audit --no-fund --no-save --package-lock=false playwright-core@1.51.1
          node tests/ui.test.cjs

      - name: Android Lint and APK build
        shell: bash
        run: |
          gradle --no-daemon --console=plain :app:lintDebug :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PidorasCoin.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose PidorasCoin.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging PidorasCoin.apk

      - name: Download your APK here
        uses: actions/upload-artifact@v4
        with:
          name: PidorasCoin-APK
          path: PidorasCoin.apk
          if-no-files-found: error
          retention-days: 30

      - name: Save interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PidorasCoin-UI-Previews
          path: ui-previews/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Android Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PidorasCoin-Lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
