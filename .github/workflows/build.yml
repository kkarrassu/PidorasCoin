          'use strict';
          const assert = require('node:assert/strict');
          const test = require('node:test');
          const CoinEngine = require('../app/src/main/assets/engine.js');
          function memory(value = '') { return {value, load() { return this.value; }, save(v) { this.value = v; return true; }}; }

          test('rapid taps consume one random draw; repeated completion counts once', () => {
            let draws = 0;
            const e = new CoinEngine(memory(), () => { draws++; return 'p'; }, () => 1000);
            assert.equal(e.begin(), 'p');
            for (let i = 0; i < 100; i++) assert.equal(e.begin(), null);
            assert.equal(draws, 1);
            assert.equal(e.finish(), 'p');
            assert.equal(e.finish(), null);
            assert.equal(e.state.p, 1);
            assert.equal(e.state.recent.length, 1);
          });

          test('process death during animation restores the same result exactly once', () => {
            const disk = memory();
            const before = new CoinEngine(disk, () => 'i', () => 12345);
            before.begin();
            const after = new CoinEngine(disk, () => { throw Error('must not reroll'); });
            assert.equal(after.state.i, 1);
            assert.equal(after.state.last, 'i');
            assert.equal(after.state.recent[0].at, 12345);
            const again = new CoinEngine(disk, () => 'p');
            assert.equal(again.state.i, 1);
            assert.equal(again.finish(), null);
          });

          test('history is bounded without losing lifetime counters or altering a streak', () => {
            const e = new CoinEngine(memory(), () => 'p', () => 1000);
            for (let n = 0; n < 240; n++) { e.begin(); e.finish(); }
            assert.equal(e.state.p, 240);
            assert.equal(e.state.i, 0);
            assert.equal(e.state.recent.length, 50);
            assert.equal(e.state.recent[0].number, 240);
            assert.equal(e.state.recent[49].number, 191);
          });

          test('clear cannot race a pending toss and preserves the haptic preference', () => {
            const e = new CoinEngine(memory(), () => 'i', () => 2000);
            e.setHaptics(false);
            e.begin();
            assert.equal(e.clear(), false);
            e.finish();
            assert.equal(e.clear(), true);
            assert.equal(e.state.p + e.state.i, 0);
            assert.equal(e.state.haptics, false);
            assert.equal(e.state.last, null);
          });

          test('damaged storage and unavailable persistence do not crash a toss', () => {
            const e = new CoinEngine(memory('{broken'), () => 'p', () => 2000);
            e.storage.save = () => { throw Error('disk full'); };
            assert.equal(e.begin(), 'p');
            assert.equal(e.finish(), 'p');
            assert.equal(e.state.p, 1);
          });

          test('invalid or missing entropy never silently turns into a chosen side', () => {
            const e = new CoinEngine(memory(), () => 'bad');
            assert.throws(() => e.begin());
            assert.equal(e.state.pending, null);
            assert.equal(e.state.p + e.state.i, 0);
          });

          test('changing haptics while a toss is pending does not reroll or lose it', () => {
            const disk = memory();
            const e = new CoinEngine(disk, () => 'i', () => 2500);
            e.begin();
            e.setHaptics(false);
            const restored = new CoinEngine(disk, () => 'p');
            assert.equal(restored.state.i, 1);
            assert.equal(restored.state.haptics, false);
          });
