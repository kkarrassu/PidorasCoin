          'use strict';
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const fs = require('node:fs');
          const {pathToFileURL} = require('node:url');
          const {chromium} = require('playwright-core');

          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.CHROME_BIN || '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--allow-file-access-from-files'],
              headless: true
            });
            try {
              const context = await browser.newContext({viewport:{width:390,height:800},deviceScaleFactor:2,isMobile:true,hasTouch:true});
              const page = await context.newPage();
              const errors = [];
              const external = [];
              page.on('pageerror', error => errors.push(String(error)));
              page.on('request', request => { if (/^https?:/.test(request.url())) external.push(request.url()); });
              await page.addInitScript(() => {
                window.__choices = 0;
                window.__haptics = 0;
                window.CoinNative = {
                  choose() { return ['p','i','i','p'][window.__choices++ % 4]; },
                  load() { return localStorage.getItem('coin-ui-test') || ''; },
                  save(value) { localStorage.setItem('coin-ui-test', value); return true; },
                  haptic() { window.__haptics++; }
                };
              });
              const url = pathToFileURL(path.resolve('app/src/main/assets/index.html')).href;
              await page.goto(url);
              await page.waitForFunction(() => !!window.coinApp);
              await page.evaluate(() => Promise.all(Array.from(document.images, image => image.decode())));
              fs.mkdirSync('ui-previews',{recursive:true});
              await page.screenshot({path:'ui-previews/01-ready.png',fullPage:true});

              await page.locator('#toss').click();
              await page.evaluate(() => {
                for (let n = 0; n < 30; n++) {
                  document.getElementById('toss').click();
                  document.getElementById('coin-button').click();
                }
              });
              await page.waitForFunction(() => !document.getElementById('toss').disabled);
              assert.equal(await page.locator('#result-name').textContent(),'PIDORAS');
              assert.equal(await page.evaluate(() => window.__choices),1);
              assert.equal(await page.locator('#total-count').textContent(),'001');
              await page.screenshot({path:'ui-previews/02-pidoras.png',fullPage:true});

              await page.locator('#coin-button').click();
              await page.waitForFunction(() => !document.getElementById('toss').disabled);
              assert.equal(await page.locator('#result-name').textContent(),'INTE PIDORAS');
              assert.equal(await page.locator('#total-count').textContent(),'002');
              await page.screenshot({path:'ui-previews/03-inte-pidoras.png',fullPage:true});

              await page.locator('#toss').click();
              await page.evaluate(() => window.coinApp.pause());
              assert.equal(await page.locator('#total-count').textContent(),'003');
              await page.reload();
              await page.waitForFunction(() => !!window.coinApp);
              assert.equal(await page.locator('#total-count').textContent(),'003');
              assert.equal(await page.locator('#result-name').textContent(),'INTE PIDORAS');
              assert.equal(await page.evaluate(() => window.__choices),0);

              await page.locator('#haptics').click();
              assert.equal(await page.locator('#haptics').getAttribute('aria-pressed'),'false');
              await page.locator('#open-history').click();
              assert.equal(await page.locator('#count-p').textContent(),'1');
              assert.equal(await page.locator('#count-i').textContent(),'2');
              await page.screenshot({path:'ui-previews/04-history.png',fullPage:true});
              await page.locator('#clear-history').click();
              await page.locator('#cancel-clear').click();
              assert.equal(await page.locator('#history-list .history-row').count(),3);
              await page.locator('#clear-history').click();
              await page.locator('#confirm-clear').click();
              await page.locator('#close-history').click();
              assert.equal(await page.locator('#total-count').textContent(),'000');
              assert.equal(await page.locator('#haptics').getAttribute('aria-pressed'),'false');

              await page.emulateMedia({reducedMotion:'reduce'});
              await page.locator('#toss').click();
              await page.waitForFunction(() => !document.getElementById('toss').disabled);
              assert.equal(await page.locator('#total-count').textContent(),'001');
              for (const viewport of [{width:320,height:640},{width:360,height:720},{width:390,height:800},{width:430,height:900}]) {
                await page.setViewportSize(viewport);
                const bounds = await page.evaluate(() => {
                  const button = document.getElementById('toss').getBoundingClientRect();
                  return {width:document.documentElement.scrollWidth,viewport:innerWidth,bottom:button.bottom,height:innerHeight};
                });
                assert.ok(bounds.width <= bounds.viewport + 1, 'Horizontal overflow: ' + JSON.stringify(viewport));
                assert.ok(bounds.bottom <= bounds.height + 1, 'Toss button outside viewport: ' + JSON.stringify(viewport) + ': ' + JSON.stringify(bounds));
                await page.screenshot({path:'ui-previews/size-' + viewport.width + '.png',fullPage:true});
              }
              assert.deepEqual(errors,[],'JavaScript runtime errors');
              assert.deepEqual(external,[],'The app must make no network requests');
              console.log('UI PASS: both outcomes, rapid taps, pause/reload, haptics, history, reduced motion, 4 viewport sizes, zero network requests.');
              await context.close();
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
