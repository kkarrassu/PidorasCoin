          <!doctype html>
          <html lang="sv">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <meta name="theme-color" content="#101112">
            <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
            <title>Pidoras Coin</title>
            <link rel="stylesheet" href="style.css">
            <script defer src="engine.js"></script>
            <script defer src="app.js"></script>
          </head>
          <body>
            <div class="ambient" aria-hidden="true"></div>
            <div class="app" id="app">
              <header class="header">
                <div class="brand">
                  <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16"/><circle cx="18" cy="18" r="12.5"/><path d="M14 25V11h5a4 4 0 010 8h-5m0-5h4.5a1 1 0 010 2H14"/></svg>
                  <div class="brand-name">PIDORAS<span>MYNTKLUBBEN</span></div>
                </div>
                <div class="header-actions">
                  <button class="icon-button" id="haptics" type="button" aria-label="Vibration" aria-pressed="true" title="Vibration">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M5 8v8M2 10v4m17-6v8m3-6v4"/><path class="haptic-slash" d="M3 3l18 18"/></svg>
                  </button>
                  <button class="icon-button" id="open-history" type="button" aria-label="Öppna historiken" title="Historik">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 119 10M3 5v6h6m3-4v5l3 2"/></svg>
                  </button>
                </div>
              </header>

              <main>
                <div class="intro">
                  <p class="eyebrow"><span></span> 50 / 50</p>
                  <h1>Låt myntet<br><span>avgöra.</span></h1>
                  <div class="edition" aria-hidden="true">TVÅ UTFALL.<br>ETT KAST.</div>
                </div>

                <div class="scene" id="scene">
                  <div class="scene-halo" aria-hidden="true"></div>
                  <div class="orbit orbit-one" aria-hidden="true"></div>
                  <div class="orbit orbit-two" aria-hidden="true"></div>
                  <span class="scene-cross cross-one" aria-hidden="true">+</span>
                  <span class="scene-cross cross-two" aria-hidden="true">+</span>
                  <span class="side-label side-label-left" aria-hidden="true">01 / P</span>
                  <span class="side-label side-label-right" aria-hidden="true">02 / IP</span>
                  <div class="coin-shadow" id="shadow" aria-hidden="true"></div>
                  <button class="coin-touch" id="coin-button" type="button" aria-label="Singla slant">
                    <span class="coin-lift" id="coin-lift">
                      <span class="coin-spin" id="coin-spin">
                        <span class="coin-edge" aria-hidden="true"></span>
                        <span class="coin-face coin-front"><img src="front.svg" width="256" height="256" alt="PIDORAS" draggable="false"></span>
                        <span class="coin-face coin-back"><img src="back.svg" width="256" height="256" alt="INTE PIDORAS" draggable="false"></span>
                      </span>
                    </span>
                  </button>
                  <div class="landing-ring" id="landing-ring" aria-hidden="true"></div>
                </div>

                <section class="result" aria-live="polite" aria-atomic="true">
                  <div class="result-kicker" id="result-kicker">REDO FÖR ETT KAST</div>
                  <div class="result-name" id="result-name">Din tur.</div>
                  <p class="result-note" id="result-note">Tryck på myntet eller knappen</p>
                </section>
              </main>

              <footer class="dock">
                <section class="recent" aria-label="Senaste kasten">
                  <div class="recent-heading"><span>SENASTE KASTEN</span><span id="total-count">000</span></div>
                  <div class="recent-items" id="recent-items"></div>
                </section>
                <button class="toss-button" id="toss" type="button">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="7" ry="3.5"/><path d="M12 11V3m-3 3 3-3 3 3M5 16v3c0 2 14 2 14 0v-3"/></svg>
                  <span id="toss-label">SINGLA SLANT</span>
                  <span class="button-dot" aria-hidden="true"></span>
                </button>
                <div class="fairness"><span class="gold-dot"></span>50% PIDORAS <span class="fairness-divider">/</span> 50% INTE PIDORAS</div>
              </footer>
            </div>

            <div class="sheet-overlay" id="history-overlay" hidden>
              <section class="sheet" id="history-sheet" role="dialog" aria-modal="true" aria-labelledby="history-title" tabindex="-1">
                <div class="sheet-handle" aria-hidden="true"></div>
                <div class="sheet-heading"><div><p class="eyebrow">SÅ FÖLL MYNTET</p><h2 id="history-title">Tidigare kast</h2></div>
                  <button class="icon-button" id="close-history" type="button" aria-label="Stäng historiken"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
                </div>
                <div class="stats">
                  <div class="stat"><span class="stat-label">PIDORAS</span><strong id="count-p">0</strong><span id="percent-p">—</span></div>
                  <div class="stat silver"><span class="stat-label">INTE PIDORAS</span><strong id="count-i">0</strong><span id="percent-i">—</span></div>
                </div>
                <p class="history-explainer">Det här är dina resultat. Chansen är alltid 50/50 vid nästa kast.</p>
                <div class="history-list" id="history-list"></div>
                <div class="clear-confirm" id="clear-confirm" hidden>
                  <span>Rensa hela historiken och nollställa räknarna?</span>
                  <div><button id="cancel-clear" type="button">Behåll</button><button class="danger" id="confirm-clear" type="button">Radera</button></div>
                </div>
                <button class="clear-button" id="clear-history" type="button">Rensa historiken</button>
              </section>
            </div>
            <div class="toast" id="toast" role="status" aria-live="polite"></div>
          </body>
          </html>
          COIN_SOURCE_009_EOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/style.css <<'COIN_SOURCE_010_EOF'
          :root{color-scheme:dark;--bg:#101112;--surface:#191a1b;--gold:#e2c185;--muted:#8b8984;--text:#f3f0e9;--silver:#c9d2dc;--coin:250px}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Roboto,sans-serif}
          body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
          button{font:inherit;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
          button:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
          button:disabled{cursor:default}
          [hidden]{display:none!important}
          .ambient{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;background:radial-gradient(ellipse at 50% 37%,#9b71300e,transparent 58%)}
          .app{position:relative;width:100%;max-width:470px;min-height:100vh;margin:auto;padding:24px 26px 17px;display:flex;flex-direction:column}
          .header{display:flex;align-items:center;justify-content:space-between;min-height:44px}
          .brand{display:flex;align-items:center;gap:10px}
          .brand-mark{height:34px;width:34px;fill:none;stroke:var(--gold);stroke-width:1.1}
          .brand-name{font-size:12px;font-weight:800;letter-spacing:2.5px;line-height:1.6}
          .brand-name span{display:block;font-size:8px;letter-spacing:3.1px;color:var(--muted);font-weight:500}
          .header-actions{display:flex;gap:4px}
          .icon-button{width:44px;height:44px;border:1px solid #ffffff0b;border-radius:50%;background:#ffffff03;color:#a7a49c;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s}
          .icon-button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
          .icon-button:active{background:#ffffff12}
          #haptics[aria-pressed=true]{color:var(--gold)}
          .haptic-slash{display:none}
          #haptics[aria-pressed=false] .haptic-slash{display:block}
          main{display:flex;flex-direction:column;flex:1}
          .intro{position:relative;margin-top:30px}
          .eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 14px;font-size:9px;letter-spacing:2.1px;font-weight:600;color:var(--gold)}
          .eyebrow>span{width:17px;height:1px;background:var(--gold)}
          h1{font-size:39px;font-weight:800;line-height:1.06;letter-spacing:-1.6px;margin:0}
          h1>span{color:var(--gold)}
          .edition{position:absolute;right:0;bottom:5px;color:#77766f;font-size:8px;line-height:1.8;letter-spacing:1.1px;text-align:right}
          .scene{position:relative;min-height:255px;flex:1;perspective:1000px;isolation:isolate}
          .scene-halo{position:absolute;left:50%;top:49%;width:330px;height:280px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,#bb8a3c15,transparent 65%);pointer-events:none;transition:background .4s}
          .scene.is-silver .scene-halo{background:radial-gradient(ellipse,#a1b5ca16,transparent 65%)}
          .orbit{position:absolute;top:54%;left:50%;width:330px;height:112px;border:1px solid #c7ad7920;border-radius:50%;transform:translate(-50%,-50%) rotate(-24deg);pointer-events:none}
          .orbit-two{width:350px;height:138px;transform:translate(-50%,-50%) rotate(28deg);border-color:#c7ad7910}
          .scene-cross{position:absolute;font-weight:300;font-size:16px;color:#b9a07066}
          .cross-one{left:4%;top:27%}.cross-two{right:0;top:77%}
          .side-label{position:absolute;top:57%;font-size:8px;letter-spacing:1.5px;color:#777268}
          .side-label-left{left:0}.side-label-right{right:0}
          .coin-touch{position:absolute;left:50%;top:46%;width:var(--coin);height:var(--coin);transform:translate(-50%,-50%);background:none;padding:0;border:0;border-radius:50%;perspective:1000px;overflow:visible;color:inherit}
          .coin-lift{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:translateY(0)}
          .coin-spin{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-13deg) rotateY(-18deg) rotateZ(-9deg)}
          .coin-face,.coin-edge,.edge-layer{display:block;position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;transform-style:preserve-3d}
          .coin-face{-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden;outline:1px solid transparent}
          .coin-face img{width:100%;height:100%;display:block;pointer-events:none}
          .coin-front{transform:translateZ(7px)}
          .coin-back{transform:rotateY(180deg) translateZ(7px)}
          .edge-layer{background:linear-gradient(135deg,#f6d796 5%,#9f7438 24%,#e4bb74 38%,#674817 63%,#e2be76 88%,#b18d4c);border:1px solid #6e4c23}
          .edge-layer:nth-child(2n){border-color:#dbb679}
          .coin-shadow{position:absolute;left:50%;bottom:3%;width:185px;height:24px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#000b,transparent 69%);opacity:.85;pointer-events:none}
          .landing-ring{position:absolute;left:50%;top:48%;height:var(--coin);width:var(--coin);margin-left:calc(var(--coin) / -2);margin-top:calc(var(--coin) / -2);border:1px solid #e2c18580;border-radius:50%;opacity:0;pointer-events:none}
          .result{text-align:center;min-height:82px;margin-top:2px}
          .result-kicker{font-size:8px;color:var(--muted);font-weight:600;letter-spacing:2.2px;min-height:10px}
          .result-name{font-size:30px;letter-spacing:-.8px;line-height:1.25;margin-top:7px;font-weight:800;min-height:38px;overflow-wrap:anywhere}
          .result-name.gold{color:var(--gold)}.result-name.silver{color:var(--silver)}
          .result-note{font-size:10px;letter-spacing:.2px;color:var(--muted);margin:7px 0 0}
          .dock{margin-top:23px}
          .recent{border-top:1px solid #ffffff12;padding-top:14px;margin-bottom:18px}
          .recent-heading{display:flex;justify-content:space-between;align-items:center;font-size:8px;color:var(--muted);letter-spacing:1.6px}
          #total-count{font-variant-numeric:tabular-nums;color:#b9b5aa}
          .recent-items{display:flex;gap:7px;margin-top:11px;min-height:32px}
          .history-chip{position:relative;display:flex;align-items:center;justify-content:center;flex:1;max-width:46px;height:32px;border-radius:8px;background:#e2c1850c;border:1px solid #e2c18528;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.6px}
          .history-chip.silver{background:#c9d2dc09;border-color:#c9d2dc23;color:var(--silver)}
          .history-chip.newest::after{position:absolute;content:"";bottom:3px;width:3px;height:3px;border-radius:50%;background:currentColor}
          .history-chip.empty{color:#44443f;border:1px dashed #ffffff0e;background:none;font-size:13px;font-weight:400}
          .toss-button{position:relative;display:flex;width:100%;min-height:59px;align-items:center;justify-content:center;gap:12px;border:1px solid #ffe3a06b;border-radius:15px;background:linear-gradient(112deg,#eed5a3,#daba7f 60%,#cda968);color:#2e271c;box-shadow:0 5px 24px #bb843310,inset 0 1px #fff4c94d;transition:transform .15s,filter .2s}
          .toss-button:active{transform:scale(.98)}
          .toss-button:disabled{filter:saturate(.55);opacity:.72}
          .toss-button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
          #toss-label{font-size:12px;font-weight:800;letter-spacing:1.8px}
          .button-dot{position:absolute;right:20px;height:5px;width:5px;border-radius:50%;background:#806337}
          .fairness{display:flex;align-items:center;justify-content:center;gap:6px;font-size:7.4px;letter-spacing:.5px;color:#aaa498;margin-top:14px}
          .gold-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);margin-right:2px}
          .fairness-divider{color:#58564f;margin:0 5px}
          .sheet-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;background:#0009;display:flex;align-items:flex-end;justify-content:center;padding-top:25px}
          .sheet{width:100%;max-width:470px;max-height:94vh;overflow-y:auto;background:#191a1b;border:1px solid #ffffff12;border-bottom:0;border-radius:26px 26px 0 0;padding:10px 24px 24px;box-shadow:0 -15px 80px #0006;overscroll-behavior:contain}
          .sheet-handle{height:4px;width:32px;background:#4c4c47;border-radius:3px;margin:0 auto 23px}
          .sheet-heading{display:flex;align-items:center;justify-content:space-between}
          .sheet-heading .eyebrow{font-size:8px;letter-spacing:1.7px;margin-bottom:9px}
          h2{font-size:25px;letter-spacing:-.7px;line-height:1.2;margin:0;font-weight:700}
          .stats{display:flex;border:1px solid #ffffff12;border-radius:16px;padding:19px;margin-top:25px}
          .stat{display:flex;flex-direction:column;flex:1;color:var(--gold);gap:8px}
          .stat+.stat{border-left:1px solid #ffffff12;padding-left:22px}
          .stat.silver{color:var(--silver)}
          .stat-label{font-size:8px;letter-spacing:1.2px}
          .stat strong{font-size:36px;line-height:1;letter-spacing:-1px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
          .stat>span:last-child{font-size:10px;color:var(--muted)}
          .history-explainer{font-size:10px;line-height:1.6;color:var(--muted);margin:13px 0 20px;max-width:300px}
          .history-list{max-height:34vh;overflow-y:auto}
          .history-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #ffffff0a;font-size:11px}
          .history-number{color:#8b8984;min-width:31px;font-size:9px;font-variant-numeric:tabular-nums}
          .history-side{color:var(--gold);font-size:11px;font-weight:600;flex:1}
          .history-side.silver{color:var(--silver)}
          .history-time{color:var(--muted);font-size:9px;font-variant-numeric:tabular-nums}
          .history-empty{padding:25px 0;text-align:center;color:#aaa498;font-size:12px;line-height:1.7}
          .clear-button{display:block;border:0;background:transparent;color:#b8a99b;margin:20px auto 0;min-height:44px;padding:10px;font-size:11px}
          .clear-button:disabled{color:#5c5b56}
          .clear-confirm{margin-top:20px;padding:15px;border:1px solid #dec19629;border-radius:14px;color:#cfc8be;font-size:12px;line-height:1.6}
          .clear-confirm>div{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
          .clear-confirm button{background:#ffffff08;color:var(--text);min-height:44px;border:1px solid #ffffff0d;border-radius:9px;padding:8px 17px;font-size:12px}
          .clear-confirm .danger{color:#e3b8a6}
          .toast{position:fixed;left:50%;bottom:25px;max-width:85%;transform:translate(-50%,15px);padding:12px 18px;z-index:30;color:var(--text);background:#2a2926;border:1px solid #e2c18526;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center;box-shadow:0 8px 24px #0005}
          .toast.visible{opacity:1;transform:translate(-50%,0)}
          body.modal-open{overflow:hidden}
          @media(min-height:850px){:root{--coin:265px}.scene{min-height:300px}.intro{margin-top:40px}.dock{margin-top:28px}.app{padding-top:30px;padding-bottom:22px}}
