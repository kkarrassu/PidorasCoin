          cat > app/src/main/java/com/pidorascoin/app/MainActivity.java <<'COIN_SOURCE_011_EOF'
          package com.pidorascoin.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.DisplayCutout;
          import android.view.HapticFeedbackConstants;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import java.io.ByteArrayInputStream;
          import java.security.SecureRandom;

          /** One trusted, bundled screen. No network or vibration permissions required. */
          public final class MainActivity extends Activity {
              private static final String ASSETS = "file:///android_asset/";
              private static final String PAGE = ASSETS + "index.html";
              private WebView web;
              private final SecureRandom random = new SecureRandom();

              @Override
              @SuppressWarnings("deprecation")
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  Window window = getWindow();
                  window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);
                  window.getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  if (Build.VERSION.SDK_INT >= 29) {
                      window.setStatusBarContrastEnforced(false);
                      window.setNavigationBarContrastEnforced(false);
                  }

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(16, 17, 18));
                  root.setOnApplyWindowInsetsListener((view, insets) -> {
                      int left = insets.getSystemWindowInsetLeft();
                      int top = insets.getSystemWindowInsetTop();
                      int right = insets.getSystemWindowInsetRight();
                      int bottom = insets.getSystemWindowInsetBottom();
                      if (Build.VERSION.SDK_INT >= 28) {
                          DisplayCutout cutout = insets.getDisplayCutout();
                          if (cutout != null) {
                              left = Math.max(left, cutout.getSafeInsetLeft());
                              top = Math.max(top, cutout.getSafeInsetTop());
                              right = Math.max(right, cutout.getSafeInsetRight());
                              bottom = Math.max(bottom, cutout.getSafeInsetBottom());
                          }
                      }
                      view.setPadding(left, top, right, bottom);
                      return insets;
                  });

                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(16, 17, 18));
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setVerticalScrollBarEnabled(false);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true); // Only our bundled, non-navigable document.
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false); // android_asset remains accessible.
                  settings.setAllowContentAccess(false);
                  settings.setAllowFileAccessFromFileURLs(false);
                  settings.setAllowUniversalAccessFromFileURLs(false);
                  settings.setBlockNetworkLoads(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);
                  web.addJavascriptInterface(new CoinBridge(), "CoinNative");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return true;
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return true;
                      }
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          if (request.getUrl().toString().startsWith(ASSETS)) return null;
                          return new WebResourceResponse("text/plain", "UTF-8", new ByteArrayInputStream(new byte[0]));
                      }
                  });
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  root.requestApplyInsets();
                  web.loadUrl(PAGE);
              }

              private final class CoinBridge {
                  @JavascriptInterface
                  public String choose() {
                      return random.nextBoolean() ? "p" : "i";
                  }

                  @JavascriptInterface
                  public void haptic() {
                      runOnUiThread(() -> {
                          if (web != null && web.hasWindowFocus()) {
                              web.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK);
                          }
                      });
                  }

                  @JavascriptInterface
                  public String load() {
                      return getSharedPreferences("coin_v2", MODE_PRIVATE).getString("state", "");
                  }

                  @JavascriptInterface
                  public boolean save(String json) {
                      if (json == null || json.length() > 32768) return false;
                      // Called on the bridge worker, not the UI thread. Persist before animating.
                      return getSharedPreferences("coin_v2", MODE_PRIVATE).edit().putString("state", json).commit();
                  }

                  @JavascriptInterface
                  public void close() {
                      runOnUiThread(() -> finish());
                  }
              }

              @Override
              protected void onPause() {
                  if (web != null) {
                      web.evaluateJavascript("window.coinApp && window.coinApp.pause()", null);
                      web.onPause();
                  }
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.onResume();
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (web == null) { super.onBackPressed(); return; }
                  web.evaluateJavascript("window.coinApp ? window.coinApp.back() : false", closed -> {
                      if (!"true".equals(closed)) finish();
                  });
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.removeJavascriptInterface("CoinNative");
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
